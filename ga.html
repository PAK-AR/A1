<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>PAK-AR - View in AR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #029390;
            color: white;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
        }
        .logo {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .loading {
            font-size: 1.2em;
            margin: 20px 0;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .error h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">PAK-AR</div>
        <div class="loading">Preparing your AR experience...</div>
        <div class="spinner"></div>
        <div id="error-message" class="error" style="display: none;">
            <h2>Unable to Load AR</h2>
            <p id="error-text"></p>
        </div>
    </div>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GYWP3B344B"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-18C1ZEDQ2J');
    </script>

    <script>
        // Force clear cache and reload if needed
        const CURRENT_VERSION = '2.1';
        const storedVersion = localStorage.getItem('pakar_version');
        
        if (storedVersion !== CURRENT_VERSION) {
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => caches.delete(name));
                });
            }
            localStorage.setItem('pakar_version', CURRENT_VERSION);
            
            if (storedVersion !== null) {
                window.location.reload(true);
            }
        }

        // Configuration - Replace these URLs with your actual links
        const CONFIG = {
            iosModelUrl: 'https://pak-ar.github.io/A1/fishfinal.usdz',
            webArFallbackUrl: 'https://mywebar.com/p/Project_2_soqi7kpa9d',
            productName: 'Fish Model',
            
            // GLOBAL CONTEXT - Configure these for each QR page
            client_id: 'CLIENT_001',
            product_id: 'FISH_001',
            qr_id: 'QR_001',
            qr_name: 'Fish Model QR',
            placement_type: 'table', // Options: table | banner | packaging | poster
            industry: 'Retail',
            product_category: 'Home Decor',
            price_range: 'Mid',
            client_city: 'Lahore',
            client_plan_type: 'Premium'
        };

        // SESSION CONTEXT - Generated once per visit
        const sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        const sessionStart = Date.now();
        
        // DEVICE CONTEXT - Generate device_id hash
        function generateDeviceId() {
            const ua = navigator.userAgent;
            let hash = 0;
            for (let i = 0; i < ua.length; i++) {
                const char = ua.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'device_' + Math.abs(hash).toString(36);
        }
        
        const deviceId = generateDeviceId();

        // Device detection with enhanced AR support detection
        function detectDevice() {
            const ua = navigator.userAgent.toLowerCase();
            const isIOS = /iphone|ipad|ipod/.test(ua);
            const isAndroid = /android/.test(ua);
            const isMobile = isIOS || isAndroid;
            const isTablet = /(ipad|tablet|playbook|silk)|(android(?!.*mobile))/i.test(ua);
            
            // Detect OS
            let os = 'Other';
            if (isIOS) os = 'iOS';
            else if (isAndroid) os = 'Android';
            
            // Detect browser
            let browser = 'Unknown';
            if (ua.includes('chrome')) browser = 'Chrome';
            else if (ua.includes('safari')) browser = 'Safari';
            else if (ua.includes('firefox')) browser = 'Firefox';
            else if (ua.includes('edge')) browser = 'Edge';
            
            // AR Support detection
            const arSupported = isIOS || isAndroid;
            const arCoreSupported = isAndroid && parseFloat(ua.match(/android\s([0-9\.]*)/)?.[1] || '0') >= 7.0;
            
            return {
                isIOS,
                isAndroid,
                isMobile,
                isTablet,
                isDesktop: !isMobile,
                device_type: isTablet ? 'tablet' : (isMobile ? 'mobile' : 'desktop'),
                os,
                browser,
                ar_supported: arSupported,
                ar_core_supported: arCoreSupported,
                userAgent: ua
            };
        }

        // GEO CONTEXT - Will be auto-detected by GA4, but we can send placeholders
        function getGeoContext() {
            // GA4 will automatically detect these, but we can set defaults
            return {
                country: 'PK', // Will be overridden by GA4
                city: 'Unknown', // Will be overridden by GA4
                region: 'Unknown', // Will be overridden by GA4
                geo_id: 'PK_Unknown' // Will be constructed by GA4
            };
        }

        // Get standard parameters for all events
        function getStandardParams() {
            const device = detectDevice();
            const geo = getGeoContext();
            
            return {
                // Global Context
                client_id: CONFIG.client_id,
                product_id: CONFIG.product_id,
                qr_id: CONFIG.qr_id,
                qr_name: CONFIG.qr_name,
                placement_type: CONFIG.placement_type,
                industry: CONFIG.industry,
                product_category: CONFIG.product_category,
                price_range: CONFIG.price_range,
                client_city: CONFIG.client_city,
                client_plan_type: CONFIG.client_plan_type,
                
                // Session Context
                session_id: sessionId,
                
                // Device Context
                device_id: deviceId,
                device_type: device.device_type,
                os: device.os,
                browser: device.browser,
                ar_supported: device.ar_supported,
                ar_core_supported: device.ar_core_supported,
                
                // Geo Context (GA4 will auto-populate)
                country: geo.country,
                city: geo.city,
                region: geo.region,
                geo_id: geo.geo_id
            };
        }

        // Send custom event to GA4
        function sendEvent(eventType, additionalParams = {}) {
            const params = {
                event_type: eventType,
                ...getStandardParams(),
                ...additionalParams
            };
            gtag('event', eventType, params);
            console.log('GA4 Event:', eventType, params);
        }

        // Track page view
        gtag('event', 'page_view', getStandardParams());
        
        // Fire qr_scan event when page loads
        sendEvent('qr_scan');

        // Show error message
        function showError(message) {
            document.querySelector('.loading').style.display = 'none';
            document.querySelector('.spinner').style.display = 'none';
            const errorDiv = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorDiv.style.display = 'block';

            // Track ar_failed event
            sendEvent('ar_failed', {
                failure_reason: message
            });
        }

        // Launch AR experience
        function launchAR() {
            const device = detectDevice();

            let method = '';
            let url = '';

            try {
                if (device.isIOS) {
                    // iOS - use Quick Look with AR parameter
                    method = 'quicklook';
                    url = CONFIG.iosModelUrl + '#allowsContentScaling=0';
                    
                    // Fire ar_launch event
                    sendEvent('ar_launch');
                    
                    // Create AR Quick Look link element
                    const a = document.createElement('a');
                    a.rel = 'ar';
                    a.href = CONFIG.iosModelUrl;
                    
                    const img = document.createElement('img');
                    a.appendChild(img);
                    document.body.appendChild(a);
                    
                    // Trigger click to open directly in AR
                    a.click();
                    
                    // Clean up
                    setTimeout(() => document.body.removeChild(a), 100);
                    
                    return;
                } else if (device.isAndroid) {
                    // Android - use Web AR (fallback)
                    method = 'web_android';
                    url = CONFIG.webArFallbackUrl;
                } else {
                    // Desktop - use Web AR (fallback)
                    method = 'web_desktop';
                    url = CONFIG.webArFallbackUrl;
                }

                // Check if URL is configured
                if (url.includes('YOUR_') || url === '') {
                    showError('AR link not configured yet. Please contact support or check back later.');
                    return;
                }

                // Fire ar_launch event
                sendEvent('ar_launch');

                console.log('Launching AR with method:', method, 'URL:', url);

                // Redirect to AR experience
                window.location.href = url;

                // If still on page after 2 seconds, show error
                setTimeout(() => {
                    if (document.visibilityState === 'visible') {
                        showError('Failed to redirect to AR: ' + url.substring(0, 50) + '...');
                    }
                }, 2000);

            } catch (error) {
                console.error('Launch error:', error);
                showError('Launch error: ' + error.message);
            }
        }

        // Track AR exit and session duration on page unload
        window.addEventListener('beforeunload', () => {
            const timeInArSec = Math.round((Date.now() - sessionStart) / 1000);
            
            // Fire ar_exit event
            sendEvent('ar_exit', {
                time_in_ar_sec: timeInArSec
            });
        });

        // Launch AR when page loads
        window.addEventListener('load', () => {
            setTimeout(launchAR, 500);
        });
    </script>
</body>
</html>
